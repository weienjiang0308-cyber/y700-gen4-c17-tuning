# 应用系统化 + 开机自启 配置
# 要系统化的应用：包名:目录名（空格分隔）。改了要重新刷模块才会重新复制安装包。
APPS="com.omarea.vtools:Scene com.wireguard.android:WireGuard"
# 开机后自动连接 WireGuard 隧道：1 开 / 0 关（也可以在 KernelSU 管理器里点本模块的「操作」按钮切换）
WG_AUTOCONNECT=1
# 隧道名（WireGuard 里显示的名字，使用前请改成你自己的隧道名）
WG_TUNNEL=YOUR_TUNNEL_NAME
# 开机后最多等多少秒网络连上
NET_WAIT=180

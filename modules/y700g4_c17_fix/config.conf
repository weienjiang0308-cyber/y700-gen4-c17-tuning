# Y700 四代 ColorOS 17 综合修复 —— 配置（改完重启生效）
# 位置：/data/adb/modules/y700g4_c17_fix/config.conf

# ===== 功能开关（1 开 / 0 关）=====
# 智能刷新率（触摸 165 / 视频 120 / 静止 30）
VRR=1
# 桌面适配（8×6 桌面边距、Dock、页码点）
LAUNCHER_FIX=1
# 竖屏桌面页码点（下方圆点）往下调多少 dp（系统默认偏高；可调范围 1~12，0 = 不调）
PORT_IND_DOWN_DP=10
# 修新应用断网（路由器下发全零 IPv6 前缀时关掉 Wi-Fi 的 IPv6）
IPV6_FIX=1
# 网络优化：TCP 接收窗口 4MB/32MB（适合长距离代理线路）；内核支持 cubic 时把拥塞控制改成 cubic（C17 内核只有 reno/bbr，保持 bbr）
NET_TUNE=1
# 关掉高通 WiFi 诊断日志服务（后台常驻记日志，对日常没用）
CNSS_DIAG_OFF=1
# 模块进程小核化（通用自动读取系统后台小核范围，自动监测所有已装/新刷模块的进程并锁到小核、低优先级）
LITTLECORE=1
# 屏幕出厂密度（桌面适配按 420 调的；C17 底包默认 440 会让横屏最后一行压到 Dock）。0 = 不改
DENSITY=420
# 音量条跟着实体音量键显示在右侧（底包按 Pad mini 默认在左侧）
VOLUME_RIGHT=1
# 音量条离屏幕边缘的距离（dp，系统原来 34）。越小越贴边；0 = 不改
VOLUME_MARGIN_DP=4
# 竖屏音量条往上移多少 dp，对齐实体音量键。0 = 不移，横屏不受影响
VOLUME_UP_DP=148

# ===== 刷新率参数 =====
# 屏幕支持：30 60 90 120 144 165
# 手指/笔触摸时（按音量键时也用这个）
TOUCH_HZ=165
# 横屏桌面图标文字大小（sp，系统原来 11）；0 = 不改
LABEL_SP_LAND=10
# 1 = 按音量键时也切到 TOUCH_HZ
VOLKEY=1
# 抬手后多少秒判定为静止
IDLE_SEC=5
# 静止时
IDLE_HZ=30
# 静止但正在播放视频时（120 能整除 24/30/60 帧，不抖）
VIDEO_HZ=120
# 静止但 GPU 负载 ≥ GAME_GPU% 时（游戏、重度动画）
GAME_HZ=165
GAME_GPU=30
# 静止但画面在动（滚动文字、动画）：GPU 负载 ≥ CONTENT_GPU% 时
CONTENT_HZ=120
CONTENT_GPU=3
# 屏幕旋转：系统决定转屏时立刻切到 ROTATE_HZ，保持 ROTATE_SEC 秒；ROTATE_DETECT=0 关闭
ROTATE_DETECT=1
ROTATE_HZ=165
ROTATE_SEC=5
# 静止后每隔多少秒复查一次（视频停了/游戏退了就降到 IDLE_HZ）
CHECK_SEC=2
# 熄屏时每隔多少秒看一次（省电）
OFF_SEC=10
# 静止（30Hz）时补发「30Hz」命令的频率：1 = 有动静的每次复查都补发；2 = 隔一次
IDLE_REASSERT=1
# 守护跑在哪个 cpuset（background = 小核），以及 nice 值（越大越不抢 CPU）
CPUSET=background
NICE=10
# 游戏名单在同目录 games.txt（一行一个包名）：名单里的应用在前台时永远 GAME_HZ
# 1 = 开机后在屏幕角落显示当前刷新率
SHOW_REFRESH=0
# 1 = 在 vrr.log 里记录每次切换（调试用）
DEBUG=0

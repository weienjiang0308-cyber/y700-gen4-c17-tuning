# 无线调试安全自启配置（改完重启生效）
# 【使用前必改】允许自动打开无线调试的自家 Wi-Fi 名单（一行一个 SSID，支持空格、中文及全屋漫游多个分支）：
# 默认是占位符，请改成你家真实的 Wi-Fi 名字；未修改前不会自动开启。
HOME_SSIDS="YOUR_HOME_WIFI_5G
YOUR_HOME_WIFI_2.4G"

# 连上不在上面名单里的其他外部 Wi-Fi（或离家断开 Wi-Fi）时，自动强制关闭无线调试（1=自动关闭保安全，0=不主动关）
AUTO_CLOSE_OUTSIDE=1

# 平时由内核网络事件实时秒级触发（0 常驻开销）；此项仅作超长保底巡检间隔（秒）
INTERVAL=180
